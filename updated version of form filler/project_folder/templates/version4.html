<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

    <title>SQL Database Connector & Form Filler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            text-align: center;
            background: linear-gradient(black, darkblue)
        }
        form {
            background: #636262;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            color: white;
        }
        label {
            font-size: 18px;
            margin-right: 10px;
        }
        input[type="text"],
        input[type="password"],
        button {
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
            width: 80%;
            border-radius: 10px;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 10px;
        }
        button:hover {
            background: #218838;
        }
        .message {
            margin-top: 20px;
            font-size: 18px;
            color: green;
        }
        h1 {
            color: ghostwhite;
        }
        h2 {
            color: ghostwhite;
        }
    </style>
</head>

<body>
    {% if message %}
    <p class="message">{{ message }}</p>
    {% endif %}
    <h1>SQL Database Connector & Form Filler</h1>
    <h2>Connect to Database</h2>
    <form action="/connect-database" method="post">
        <label>Host:</label>
        <input type="text" name="host" required placeholder="Enter host (e.g., localhost)">
        <br><br>
        <label>Username:</label>
        <input type="text" name="user" required placeholder="Enter username">
        <br><br>
        <label>Password:</label>
        <input type="password" name="password" required placeholder="Enter password">
        <br><br>
        <label>Database Name:</label>
        <input type="text" name="database" required placeholder="Enter database name">
        <br><br>
        <button type="submit">Connect</button>
    </form>
    <h2>Form Filler</h2>
    <form action="/run-automation" method="post">
        <label>
            <input type="radio" name="browser" value="chrome" checked> Chrome
        </label>
        <label>
            <input type="radio" name="browser" value="firefox"> Firefox
        </label>
        <br><br>
        <label>Enter Form URL:</label>
        <input type="text" name="form_url" required placeholder="Enter full URL">
        <br><br><label>Select Waiting Time:</label>
        <select name="waiting_time" required>
            <option value="2">2 seconds</option>
            <option value="3">3 seconds</option>
            <option value="4">4 seconds</option>
            <option value="5">5 seconds</option>
        </select> 
        <br><br>
        <button type="submit">Submit & Fill Form</button>
    </form>
</body>
</html>
